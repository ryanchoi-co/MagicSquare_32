[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicsquare"
version = "0.1.0"
description = "4x4 Magic Square Dual-Track TDD practice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pydantic>=2.0"]
gui = ["PyQt6>=6.6", "pydantic>=2.0"]

[project.scripts]
magicsquare-gui = "magicsquare.boundary.screen.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "boundary: Boundary layer contract tests (UT-*)",
    "domain: Domain layer tests (DT-*)",
    "integration: Integration tests (IT-*)",
]

[tool.black]
line-length = 88
